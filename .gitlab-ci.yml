# Use official Node.js 20 lightweight image
default:
  image: node:20-alpine
  before_script:
    # Enable pnpm package manager
    - corepack enable
    - corepack prepare pnpm@latest --activate
    # Cache & install dependencies
    - pnpm install --frozen-lockfile

# Define pipeline stages
stages:
  - test
  - build

# Cache pnpm store across pipeline runs for fast builds
cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

# Stage 1: Code quality & type check
lint_and_typecheck:
  stage: test
  script:
    - pnpm lint
    - npx tsc --noEmit

# Stage 2: Test building the app for production
build_project:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - .output/
    expire_in: 1 week
